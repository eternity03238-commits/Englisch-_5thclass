<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8ED2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Möwenflug">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Möwenflug</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column on a sunny seaside; the child's own seagull lives on a pier post at the top of home; feedback slides up from the bottom */
*,*::before,*::after{box-sizing:border-box}
:root{
  --sky:#D6F0FF; --sky-2:#F3FAFF; --panel:#FFFFFF; --panel-2:#EAF5FB; --line:#BCDCEC;
  --ink:#0E2A47; --muted:#4E6B85; --dim:#8DA5B9;
  --flame:#FF8A3D; --flame-2:#FF5E5B; --good:#1FB97E; --good-ink:#FFFFFF; --bad:#EF4D67; --bad-ink:#FFFFFF; --ice:#0B95C2; --navy:#16406B;
  --shadow:0 4px 0 rgba(14,42,71,.14);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,#8ED2FF 0,#C4EAFF 30%,#E4F6FF 60%,#F4FBFF 100%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:60}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.muted{color:var(--muted)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:1.02rem;transition:transform .12s ease;font-family:var(--f-display);letter-spacing:.01em}
.btn:active{transform:translateY(2px) scale(.98)}
.btn-main{background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 5px 0 #C9443F,0 10px 24px rgba(255,94,91,.3)}
.btn-soft{background:var(--panel);border:2px solid var(--line);color:var(--navy);box-shadow:var(--shadow)}
.btn-ghost{background:rgba(255,255,255,.6);border:2px solid var(--line);color:var(--muted)}
.btn-good{background:var(--good);color:var(--good-ink);box-shadow:0 5px 0 #148A5C}
.btn-bad{background:var(--bad);color:var(--bad-ink);box-shadow:0 5px 0 #B32E45}
.btn-ice{background:var(--ice);color:#fff;box-shadow:0 5px 0 #08698A}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:22px;height:22px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--navy)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.field,.answer{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--sky-2);color:var(--ink);font:inherit;font-size:1.15rem;padding:0 16px}
.answer{font-size:1.25rem;font-weight:600;min-height:60px}
.field::placeholder,.answer::placeholder{color:var(--dim)}
.answer.shake{animation:shake .4s;border-color:var(--bad)}
.tip{border-left:4px solid var(--flame);background:#FFF3E8;border-radius:4px 12px 12px 4px;padding:10px 12px;font-size:.92rem;color:var(--ink)}
.tip b{color:#C4551A}
.seg{display:flex;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--navy);box-shadow:inset 0 0 0 2px var(--ice)}
[hidden]{display:none!important}

/* seagull */
.gull{display:block;overflow:visible;width:100%;height:auto}
.gull .bob{animation:bob 2.6s ease-in-out infinite}
.gull.happy .wing{animation:flap .25s ease-in-out 4;transform-box:fill-box;transform-origin:80% 30%}
.gull.sleep .bob{animation:none}
.zz{font-family:var(--f-display);font-weight:700;fill:var(--navy);animation:zz 2.4s ease-in-out infinite}

/* onboarding */
.hero{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95;color:var(--navy);text-shadow:0 4px 0 rgba(255,255,255,.8)}
.hero span{color:var(--flame-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--navy)}

/* home */
.topbar{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;padding:3px}
.who{min-width:0}
.who b{display:block;font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}
.who small{color:var(--muted);font-size:.8rem}
.bubble{position:absolute;left:10px;top:10px;max-width:calc(100% - 118px);background:rgba(255,255,255,.95);border-radius:16px;padding:7px 10px;font-weight:600;color:var(--navy);box-shadow:0 6px 18px rgba(14,42,71,.18);display:flex;gap:8px;align-items:center}
.bubble .who-says{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bubble .en{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.bubble small{display:block;font-size:.74rem;line-height:1.25}
.bubble .speak{width:34px;height:34px}
.route{position:relative;height:34px}
.route .track{position:absolute;left:8px;right:8px;top:15px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.route .done{position:absolute;left:8px;top:15px;height:4px;border-radius:2px;background:var(--ice)}
.route .stop{position:absolute;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.route .stop.on{border-color:var(--ice);background:var(--ice)}
.route .stop.goal{width:18px;height:18px;margin-left:-9px;top:8px;border-color:var(--flame)}
.route .plane{position:absolute;top:-4px;width:40px;margin-left:-20px;transition:left .8s}
.lesson-btn{width:100%;padding:18px 20px;border-radius:22px;text-align:left;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 6px 0 #C9443F,0 14px 30px rgba(255,94,91,.28);position:relative;overflow:hidden}
.lesson-btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 3.2s ease-in-out infinite}
.lesson-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C9443F}
.lesson-btn b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.lesson-btn small{display:block;font-weight:600;opacity:.95;margin-top:3px}
.lesson-btn .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.lesson-btn.done{background:linear-gradient(180deg,#5DB6DD,#2E8FBE);box-shadow:0 6px 0 #1F6E95}
.lesson-btn.done::after{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow);min-width:0}
.tile:active{transform:scale(.98)}
.tile .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tile b{font-family:var(--f-display);font-size:1.08rem;color:var(--navy)}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile.locked{opacity:.65}
.t-red .ti{background:#FFE4E8;color:var(--bad)}
.t-ice .ti{background:#DDF2FA;color:var(--ice)}
.t-flame .ti{background:#FFEBDD;color:#D9621B}
.t-good .ti{background:#DCF6EB;color:#11925F}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.foot .btn{min-height:42px;font-size:.88rem;padding:0 14px;border-radius:12px}
.storm{display:flex;gap:14px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(160deg,#3C5A80,#22395A);color:#fff;border:2px solid #22395A;box-shadow:var(--shadow)}
.storm .label{color:#FFD45A}
.storm small{color:#D3E0EE}
.storm .count{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;color:#FFD45A}
.lh{width:64px;display:block}
.daydots{display:flex;gap:4px}
.daydots span{flex:1;text-align:center;font-size:.66rem;font-weight:700;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.12);color:#D3E0EE;min-width:0}
.daydots span.now{background:#FFD45A;color:#22395A}
.daydots span.past{background:rgba(31,185,126,.45);color:#fff}
.ampel{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.ampel i{width:12px;height:12px;border-radius:50%}
.storm .btn-soft{background:#fff;color:var(--navy);border-color:#fff}

/* lesson */
.mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:6px;background:linear-gradient(rgba(196,234,255,.95) 70%,rgba(196,234,255,0))}
.mbar .close{width:42px;height:42px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--navy)}
.prog{flex:1;height:14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--flame),var(--good));border-radius:999px;transition:width .5s ease}
.combo{min-width:62px;justify-content:center}
.combo.hot{border-color:var(--flame);color:#D9621B}
.coach{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.coach .gmini{width:64px;flex:none}
.coach .say{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-weight:600;color:var(--navy);box-shadow:var(--shadow)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;margin-top:12px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:var(--shadow)}
.ask{font-size:.95rem;color:var(--muted);font-weight:600}
.stagebadge{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:#08799E;border:1.5px solid var(--line)}
.big{font-family:var(--f-display);font-size:clamp(1.8rem,8.5vw,2.5rem);font-weight:700;line-height:1.15;word-break:break-word;color:var(--navy)}
.de-big{font-size:clamp(1.35rem,6.2vw,1.85rem);font-weight:700;line-height:1.25;color:var(--ink)}
.ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS",var(--f-body);color:#08799E;font-size:1rem}
.speak{width:50px;height:50px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ice)}
.speak.lg{width:104px;height:104px;margin:4px auto;background:#E3F5FC;border-color:var(--ice)}
.speak.lg .icon{width:44px;height:44px}
.speak.playing{animation:pulse .8s ease infinite}
.example{background:var(--panel-2);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.example p{margin:0}
.example .de{color:var(--muted);font-size:.9rem}
.sentence{font-size:1.25rem;line-height:1.6;font-weight:600}
.sentence .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--flame);color:#D9621B}
.hint-line{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#08799E;text-align:center;font-size:1.2rem;min-height:1.4em}
.mic{width:120px;height:120px;border-radius:50%;margin:4px auto;display:grid;place-items:center;background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 6px 0 #C9443F}
.mic .icon{width:52px;height:52px}
.mic.listening{animation:pulse 1s ease infinite;background:var(--good)}
.heard{text-align:center;color:var(--muted);min-height:1.4em}
.answer-line{min-height:70px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;border-radius:16px;border:2px dashed var(--line);background:var(--sky-2)}
.answer-line .end{align-self:center;font-size:1.3rem;font-weight:700;color:var(--muted)}
.tiles-pool,.badline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wtile{min-height:46px;padding:0 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #BCDCEC;color:var(--navy)}
.wtile:active{transform:translateY(3px);box-shadow:0 1px 0 #BCDCEC}
.wtile.placed{background:#E3F5FC;border-color:var(--ice);box-shadow:none}
.wtile.used{visibility:hidden}
.wtile.hit{background:var(--good);color:#fff;border-color:var(--good)}
.wtile.miss{background:var(--bad);color:#fff;border-color:var(--bad)}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(14,42,71,.15)}
.sheet:not(.show){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.sheet.show{transform:none}
.sheet.ok{background:#E2F8EE;border-top:4px solid var(--good)}
.sheet.no{background:#FFE9EC;border-top:4px solid var(--bad)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.sheet.ok h3{color:#0E7C51}
.sheet.no h3{color:#B52A43}
.sheet .sol{display:flex;align-items:center;gap:12px}
.sheet .sol b{font-size:1.15rem;color:var(--navy)}
.sheet .sol small{display:block;color:var(--muted)}
.sheet .yours{font-size:.9rem;color:var(--muted)}
.sheet .yours s{color:#B52A43}

/* flashcards */
.fc{display:grid;perspective:1200px;margin-top:10px}
.fc-inner{display:grid;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px 20px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;
  background:#fff;border:2px solid var(--line);box-shadow:0 14px 30px rgba(14,42,71,.14)}
.fc-back{transform:rotateY(180deg);border-color:var(--ice);background:#F2FBFF}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate .btn{min-height:64px;font-size:1.1rem}
.deck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.deck:active{transform:scale(.99)}
.deck b{display:block;color:var(--navy)}
.deck small{color:var(--muted);font-size:.82rem}
.deck .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:#08799E}
.deck.hot{border-color:var(--flame)}
.deck[disabled]{opacity:.45}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* boss */
.boss-box{display:flex;align-items:center;gap:12px;background:#FFF0F2;border:2px solid #F7B7C2;border-radius:20px;padding:10px 14px;margin-top:10px}
.crab{width:84px;height:70px;flex:none;animation:bob 2s ease-in-out infinite}
.crab.hit{animation:hit .45s ease}
.hp{height:16px;border-radius:999px;background:#fff;border:1.5px solid #F7B7C2;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--flame));transition:width .4s ease}
.shields{display:flex;gap:4px;color:var(--ice)}
.shields .off{opacity:.2}

/* summary, lists, parents */
.trophy{text-align:center;padding-top:6px}
.stars-row{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars-row svg{width:56px;height:56px}
.stars-row .s{animation:starIn .5s cubic-bezier(.2,.9,.3,1.5) both}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;color:#D9621B;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
details.pl{background:var(--panel);border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
details.pl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;color:var(--navy)}
details.pl summary::-webkit-details-marker{display:none}
details.pl summary .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;flex:none}
details.pl[open] summary{border-bottom:1.5px solid var(--line)}
.wlist{display:flex;flex-direction:column}
.witem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--panel-2)}
.witem:last-child{border-bottom:0}
.witem .txt{flex:1;min-width:0}
.witem .txt b{display:block;color:var(--navy)}
.witem .txt small{color:var(--muted)}
.witem.unknown .txt b{color:var(--dim)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--flame)}
.witem .speak{width:38px;height:38px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:var(--shadow)}
.bdg .e{font-size:2.2rem;filter:grayscale(1) opacity(.35)}
.bdg.got{border-color:var(--flame);background:#FFF6EE}
.bdg.got .e{filter:none}
.bdg b{color:var(--navy)}
.bdg small{color:var(--muted);font-size:.78rem}
.diploma{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px dashed var(--line);background:#fff}
.diploma.got{border:2px solid #E8B64A;background:linear-gradient(135deg,#FFF8DF,#FFFFFF)}
.diploma .seal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.diploma.got .seal{background:#E8B64A;color:#fff}
.postcard{background:#FFFDF6;border:2px solid #E8D9A8;border-radius:16px;padding:18px 18px 18px;box-shadow:var(--shadow);font-family:var(--f-display);font-size:1.15rem;line-height:1.5;color:var(--navy);position:relative}
.postcard .stamp{float:right;width:56px;height:64px;margin:0 0 6px 10px;border:2px dashed #E8B64A;border-radius:6px;display:grid;place-items:center;background:#FFF3C9;padding:4px}
.postcard p{margin:0 0 6px}
.panel textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--sky-2);color:var(--ink);font:inherit;font-size:.8rem;padding:10px;word-break:break-all}
.cal{display:flex;gap:4px;flex-wrap:wrap}
.cal i{width:18px;height:18px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.cal i.on{background:var(--good);border-color:var(--good)}
.problem{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--panel-2)}
.problem:last-child{border-bottom:0}
.problem span{color:#B52A43;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:#FFE9EC;border:1.5px solid #F7B7C2;color:#B52A43}
.chip.ok{background:#E2F8EE;border-color:#9EE3C5;color:#0E7C51}
.pin{font-size:2rem;letter-spacing:.6em;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:70;background:var(--navy);color:#fff;font-weight:700;padding:12px 20px;border-radius:16px;box-shadow:0 10px 30px rgba(14,42,71,.3);transition:transform .4s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.xpfloat{position:fixed;z-index:65;font-family:var(--f-display);font-weight:700;color:#D9621B;font-size:1.4rem;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 #fff}

/* harbor home */
.harbor-wrap{position:relative;height:300px;border-radius:28px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);background:#9AD8FF}
.harbor{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.harbor::-webkit-scrollbar{display:none}
.harbor-in{position:relative;height:100%;width:1235px}
.harbor-in svg.world{display:block;width:100%;height:100%}
.world .bld{cursor:pointer}
.world .bld:active{opacity:.85}
.world .cl{animation:cloud 60s linear infinite}
.world .cl.c2{animation-duration:85s}
.world .cl.c3{animation-duration:110s}
.world .wv{animation:wave 6s ease-in-out infinite}
.world .wv.v2{animation-duration:8s;animation-direction:reverse}
.world .rain{animation:rain .6s linear infinite}
.world .wheel{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
.world .beam{transform-box:view-box;animation:beam 5s ease-in-out infinite}
.world .twinkle{animation:twinkle 3s ease-in-out infinite}
.hgull{position:absolute;width:74px;cursor:pointer;transition:left 1.2s cubic-bezier(.5,0,.3,1),top 1.2s}
.hgull.flying{animation:hopfly 1.2s ease-in-out}
.harbor-wrap .bubble{z-index:3}
.swipehint{position:absolute;right:10px;top:12px;z-index:3;background:rgba(255,255,255,.85);color:var(--navy);font-weight:700;font-size:.72rem;padding:4px 9px;border-radius:999px;pointer-events:none;transition:opacity .6s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.harbor-wrap.storm3 .flash{animation:flash 7s infinite}
.stagebar{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
.stagebar b{font-family:var(--f-display);color:var(--navy);white-space:nowrap}
.stagebar small{font-size:.78rem;text-align:right;line-height:1.2}
.minibar{flex:1;height:10px;border-radius:999px;background:#DCEBF3;overflow:hidden;min-width:30px}
.minibar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ice),var(--good));transition:width .8s}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:20px;color:#fff;min-height:96px}
.bigbtn b{font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.bigbtn small{font-size:.8rem;opacity:.95;line-height:1.25}
.bigbtn .icon{width:26px;height:26px}
.bigbtn:active{transform:translateY(3px)}
.b-good{background:linear-gradient(180deg,#2FCB8E,#17A570);box-shadow:0 5px 0 #0F7E54}
.b-ice{background:linear-gradient(180deg,#22AEDB,#0A88B3);box-shadow:0 5px 0 #086A8C}
/* gull life */
.gull .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.gull .head{transform-box:fill-box;transform-origin:30% 85%;animation:tilt 9s ease-in-out infinite}
.gull.happy .bob{animation:hop .45s ease-in-out 2}
.gull.confused .head{animation:conf 1s ease-in-out}
.gmini{position:relative}
.gmini .fish{position:absolute;left:50%;top:-6px;width:30px;margin-left:-15px;animation:fishup 1s ease-out forwards;pointer-events:none}
.gmini .qm{position:absolute;right:-4px;top:-10px;font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--bad);animation:pop .3s}
/* wardrobe & place */
.ward-hero{width:190px;margin:0 auto}
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.acc .pv{width:54px;flex:none}
.acc b{display:block;color:var(--navy)}
.acc small{color:var(--muted);font-size:.82rem}
.acc .st{margin-left:auto;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);flex:none}
.acc.on{border-color:var(--good);background:#F0FBF6}
.acc.on .st{background:var(--good);color:#fff}
.acc.locked{opacity:.6}
.place-head{display:flex;align-items:center;gap:12px}
.place-head .dot{width:22px;height:22px}
.bar{height:12px;border-radius:999px;background:#DCEBF3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tilt{0%,78%,100%{transform:rotate(0)}82%,90%{transform:rotate(-9deg)}}
@keyframes conf{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(16deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes fishup{0%{opacity:0;transform:translateY(20px) rotate(-20deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px) rotate(20deg)}}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(1500px)}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flash{0%,90%,93%,100%{opacity:0}91%,94%{opacity:.75}}
@keyframes hopfly{0%,100%{transform:translateY(0)}50%{transform:translateY(-60px) rotate(-6deg)}}

/* journal & album */
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:#FFFDF6;border:2px solid #E8D9A8;box-shadow:var(--shadow);text-align:left;min-width:0}
.pc svg{width:100%;height:auto;border-radius:9px;display:block}
.pc span{font-family:var(--f-display);font-weight:700;color:var(--navy);padding:0 2px}
.pc em{position:absolute;right:-6px;top:-8px;font-style:normal;font-weight:700;font-size:.72rem;background:var(--flame-2);color:#fff;padding:3px 8px;border-radius:999px;transform:rotate(8deg);box-shadow:var(--shadow)}
.pc.new{animation:pop .5s}
.pc.locked{background:rgba(255,255,255,.6);border-style:dashed;border-color:var(--line);box-shadow:none}
.pc.locked .pcq{aspect-ratio:16/10;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--dim)}
.pc.locked span{color:var(--muted)}
.pc small{color:var(--muted);font-size:.78rem;padding:0 2px}
.newdot{display:inline-block;margin-left:6px;font-size:.75rem;background:var(--flame-2);color:#fff;padding:2px 8px;border-radius:999px}
.album{background:#FFFDF6;border:2px solid #E8D9A8;border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(232,217,168,.35) 27px 28px)}
.stkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.stkcell{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.stkcell b{font-size:.8rem;color:var(--navy);line-height:1.2}
.stkcell small{font-size:.7rem;color:var(--muted);line-height:1.2}
.stkcell.locked b{color:var(--dim)}
.stk{width:72px;height:72px;display:block;transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 2px rgba(14,42,71,.18))}
.stk.empty{filter:none;transform:none}
.stk.fly{animation:stickfly .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stickfly{0%{transform:translate(60px,-80px) scale(2.2) rotate(40deg);opacity:0}60%{opacity:1}100%{transform:rotate(var(--r,0deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes pop{from{opacity:.4;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hit{0%{transform:translateX(0);filter:none}30%{transform:translateX(10px) rotate(6deg);filter:brightness(1.6)}60%{transform:translateX(-6px)}100%{transform:none}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.tiles{gap:8px}.tile{padding:12px}}
</style>

<body>
<div id="nojs" style="position:relative;z-index:99;max-width:520px;margin:40px auto;padding:24px 20px;border-radius:18px;background:#fff;border:2px solid #0B95C2;color:#0E2A47;font:16px/1.5 system-ui,sans-serif;text-align:center">
<b style="font-size:1.3rem;color:#16406B">Möwenflug</b><br><br>
Diese Lern-App startet nur in einem richtigen Browser (Safari oder Chrome), nicht in einer Datei-Vorschau.<br><br>
Bitte öffne sie über den Link, den du bekommen hast.
</div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main id="app">
  <section id="s-onboard" class="stack" hidden></section>

  <section id="s-home" class="stack" hidden>
    <div class="topbar">
      <div class="avatar" id="hAvatar"></div>
      <div class="who"><b id="hName"></b><small id="hRank"></small></div>
      <div class="spacer"></div>
      <span class="pill" title="Tage hintereinander geübt"><span aria-hidden="true">🔥</span><span id="hStreak">0</span></span>

    </button>
    <div class="duo">
      <button class="bigbtn b-good" data-act="openDeck" data-mode="mama"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 14.6l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/><path d="M6 19h12v3H6z"/></svg><b>Möwen-Prüfung</b><small>mit Mama, Papa, Oma …</small></button>
      <button class="bigbtn b-ice" data-act="openExtras"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><b>Extras</b><small>Spiele, Karte, Kleiderschrank</small></button>

      <button class="btn btn-ghost" data-act="openParents">Für Eltern</button>

  <section id="s-mission" hidden>
    <div class="mbar">
      <button class="close" data-act="quit" aria-label="Beenden"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="pill combo" id="combo"><span aria-hidden="true">🔥</span><span id="comboN">0</span></span>
    </div>
    <div id="bossBox" class="boss-box" hidden>
      <svg class="crab" id="crab" viewBox="0 0 120 100" aria-label="Krabbe Kneifer">
        <path d="M20 30q-14-6-10-22 10 2 14 12l-6 2q8 0 10 10z" fill="#E8574A"/><path d="M100 30q14-6 10-22-10 2-14 12l6 2q-8 0-10 10z" fill="#E8574A"/>
        <path d="M22 70l-14 10M28 76l-10 16M98 70l14 10M92 76l10 16" stroke="#C9443F" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="60" cy="62" rx="40" ry="26" fill="#F06B57"/><ellipse cx="60" cy="56" rx="32" ry="16" fill="#F7896F"/>
        <path d="M46 34v-12M74 34v-12" stroke="#C9443F" stroke-width="4"/><circle cx="46" cy="20" r="7" fill="#fff"/><circle cx="74" cy="20" r="7" fill="#fff"/><circle cx="47" cy="21" r="3.5" fill="#0E2A47"/><circle cx="73" cy="21" r="3.5" fill="#0E2A47"/>
        <path d="M48 70q12 8 24 0" stroke="#7A1F1A" stroke-width="4" fill="none" stroke-linecap="round"/>

      <div style="flex:1;min-width:0" class="stack">

        <div class="hp"><i id="hpBar" style="width:100%"></i></div>
        <small class="muted">Kneifer klaut Wörter! Hol sie mit richtigen Antworten zurück.</small>
      </div>
    </div>
    <div id="card"></div>
  </section>

  <section id="s-extras" class="stack" hidden>
    <div class="row"><button class="btn btn-soft" data-act="home">Zurück</button></div>
    <h1 class="display" style="font-size:1.8rem;color:var(--navy)">Extras</h1>
    <div class="tiles">
      <button class="tile t-ice" data-act="openJournal">

      <button class="tile t-good" data-act="openWardrobe">
        <span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3l4 2 4-2 5 4-3 4-2-1v11H8V10l-2 1-3-4z"/></svg></span>

      </button>
      <button class="tile t-ice" data-act="openDeck" data-mode="kid">

      <button class="tile t-good" data-act="openDeck" data-mode="mama">

      </button>
      <button class="tile t-ice" data-act="openPost">
        <span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v14H3zm2 2v.5l7 5 7-5V7zm0 3v7h14v-7l-7 5z"/></svg></span>
        <b>Möwen-Post</b><small id="postSub"></small>
      </button>
      <button class="tile t-red" data-act="startBoss" id="bossTile">
        <span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c4 0 7 2.4 7 5.5S16 19 12 19s-7-2.4-7-5.5S8 8 12 8zM4 4l3 4-2 1zm16 0l-3 4 2 1zM3 14H1v2h2zm20 0h-2v2h2z"/></svg></span>
        <b>Krabben-Duell</b><small id="bossSub"></small>

        <span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3l6 2 6-2v16l-6 2-6-2-6 2V5zm1 2.3v12.4l4 1.3V6.6z"/></svg></span>

    </div>
  </section>
  <section id="s-wardrobe" class="stack" hidden></section>
  <section id="s-place" class="stack" hidden></section>
  <section id="s-journal" class="stack" hidden></section>

</main>

<script>
(() => {
"use strict";
try{ document.getElementById("nojs").remove(); }catch(e){}

const level = () => Math.floor(S.xp/LEVEL_XP)+1;
const rank = l => RANKS.filter(r=>l>=r[0]).pop()[1];
const st = id => S.words[id];
const ss = id => S.sent[id];
const introduced = () => W.filter(w=>st(w.id));
const isSafe = w => st(w.id) && st(w.id).b>=3;
function testActive(){ return !!(S.test && S.test.pl && S.test.date && dayDiff(today(), S.test.date) >= 0); }
const isTestWord = w => testActive() && w.pl===S.test.pl;
function dueWords(){
  const t = today();
  return W.filter(w=>{ const s=st(w.id); if(!s) return false; if (s.due<=t) return true; return isTestWord(w) && s.last!==t; })
    .sort((a,b)=> (isTestWord(b)-isTestWord(a)) || (st(a.id).b-st(b.id).b) || (st(a.id).due<st(b.id).due?-1:1));
}
function newWords(){
  const order = PLANETS.map(p=>p.id), tp = testActive() ? S.test.pl : null;
  return W.filter(w=>!st(w.id)).sort((a,b)=>{
    const pa = a.pl===tp ? -1 : order.indexOf(a.pl), pb = b.pl===tp ? -1 : order.indexOf(b.pl);
    return pa-pb;
  });
}
function planNew(dueCount){
  if (testActive()){ const left = W.filter(w=>w.pl===S.test.pl && !st(w.id)).length; if (left) return Math.min(8, left); }
  return dueCount>=16 ? 2 : dueCount>=10 ? 4 : 6;
}
function focusPlace(){
  if (testActive()) return PMAP[S.test.pl];
  return PLANETS.find(p=>W.some(w=>w.pl===p.id && !isSafe(w))) || PLANETS[0];
}
function placeStats(pid){
  const ws = W.filter(w=>w.pl===pid);
  return {total:ws.length, seen:ws.filter(w=>st(w.id)).length, safe:ws.filter(isSafe).length, fixed:ws.filter(w=>st(w.id)&&st(w.id).b>=2).length};
}
function addXP(n){

  if (level()>before){ sfx("level"); confetti(); setTimeout(()=>toast(`Level ${level()}! Du bist jetzt <b>${rank(level())}</b>`),300); }
}
function addKm(n){

function markDay(){
  const t = today();
  if (S.lastDay===t) return;
  S.streak = (S.lastDay===addDays(t,-1)) ? S.streak+1 : 1;
  S.lastDay = t; if (!S.days.includes(t)) S.days.push(t);
  if (S.days.length>150) S.days = S.days.slice(-150);
}
/* src: "mission" | "kid" | "mama" */
function updateWord(w, ok, src, noPromote){
  const t = today();
  let s = S.words[w.id];
  S.stats.answers++; if (ok) S.stats.right++;
  if (!s){
    if (src==="mama" && ok){ S.words[w.id] = {b:3,due:addDays(t,INTERVAL[3]),up:t,r:1,w:0,last:t,seen:t,fam:t}; save(); return; }
    S.words[w.id] = {b:1,due:addDays(t,1),up:t,r:ok?1:0,w:ok?0:1,last:t,seen:t}; save(); return;
  }
  s.last = t;
  if (ok){
    s.r++;
    if (src==="mama") s.fam = t;
    if (src!=="kid" && !noPromote && s.up!==t){ s.b = Math.min(5, s.b+1); s.up = t; s.due = addDays(t, INTERVAL[s.b]); }
  } else { s.w++; s.b = 1; s.due = addDays(t,1); delete s.fam; }
  save();
}
function updateSent(s, ok, noPromote){
  const t = today();
  const x = S.sent[s.id] || (S.sent[s.id] = {b:0,due:t,up:null,r:0,w:0});
  x.last = t;
  if (ok){ x.r++; S.stats.sentRight++; if (!noPromote && x.up!==t){ x.b=Math.min(5,x.b+1); x.up=t; x.due=addDays(t,INTERVAL[x.b]); } }
  else { x.w++; x.b = Math.max(0, Math.min(x.b,1)); x.due = addDays(t,1); }
  save();
}
function sentUnlocked(s){
  if (s.pl==="gram") return true;
  const ws = W.filter(w=>w.pl===s.pl);
  return ws.filter(w=>st(w.id)).length >= Math.min(3, ws.length);
}
function pickSentences(n, only, needBad){
  const t = today(), tp = testActive() ? S.test.pl : null;
  const c = SENT.filter(s=>sentUnlocked(s) && (!only || s.pl===only) && (!needBad || s.bad));
  const pri = s => (s.pl===tp ? 0 : s.pl==="gram" ? 1 : 2);
  const due = shuffle(c.filter(s=>ss(s.id) && ss(s.id).due<=t && ss(s.id).up!==t)).sort((a,b)=>pri(a)-pri(b));
  const fresh = shuffle(c.filter(s=>!ss(s.id))).sort((a,b)=>pri(a)-pri(b));
  let out = due.concat(fresh).slice(0,n);
  if (needBad && out.length<n) out = out.concat(shuffle(c.filter(s=>!out.includes(s))).slice(0,n-out.length));
  if (only && out.length<n) out = out.concat(pickSentences(n-out.length, null, needBad).filter(s=>!out.includes(s)));
  if (!only && !needBad && n>=2 && out.length && !out.some(s=>s.pl==="gram")){
    const g = due.concat(fresh).find(s=>s.pl==="gram"); if (g) out[out.length-1] = g;
  }
  return out;
}
function testReadiness(){
  if (!testActive()) return null;
  const ws = W.filter(w=>w.pl===S.test.pl);
  const famOk = ws.filter(w=>{ const s=st(w.id); return s && (s.b>=3 || (s.fam && dayDiff(s.fam,today())<=3)); }).length;
  const seen = ws.filter(w=>st(w.id)).length, fixed = ws.filter(w=>st(w.id)&&st(w.id).b>=2).length;
  if (famOk===ws.length) return {c:"#1FB97E", t:"Grün: testbereit", d:"Alle Wörter sitzen oder wurden bei der Möwen-Prüfung bestätigt."};
  if (seen===ws.length && fixed>=ws.length*.7) return {c:"#F2B632", t:"Gelb: fast bereit", d:`Noch ${ws.length-famOk} Wörter bei der Möwen-Prüfung bestätigen.`};
  return {c:"#EF4D67", t:"Rot: noch üben", d: seen<ws.length ? `${ws.length-seen} Wörter sind noch neu.` : `${ws.length-fixed} Wörter sitzen noch nicht.`};
}

let M = null;
function buildWordQueue(news, reviews){
  const q = [], revs = shuffle(reviews);
  for (let i=0;i<news.length;i+=2){
    const g = news.slice(i,i+2);
    g.forEach(w=>q.push({kind:"intro",w}));
    revs.splice(0,2).forEach(w=>q.push({kind:"word",w}));
    g.forEach(w=>q.push({kind:"word",w,fresh:true}));
  }
  revs.forEach(w=>q.push({kind:"word",w}));
  return q;
}
function startDaily(){
  const dueAll = dueWords();
  const nws = newWords().slice(0, planNew(dueAll.length));
  const q = buildWordQueue(nws, dueAll.slice(0,12));
  const fx = nws.length || dueAll.length ? pickSentences(1, null, true) : [];
  pickSentences(2).filter(s=>!fx.includes(s)).forEach(s=>q.push({kind:"sent",s}));
  fx.forEach(s=>q.push({kind:"fix",s}));
  if (!q.length){ toast("Alles geschafft für heute!"); return; }
  begin("daily", q);
}
function startTest(){

function pickType(w, it){
  if (it.type) return it.type;
  if (it.fresh) return "type";
  const s = st(w.id), b = s ? s.b : 1;
  let opts = b<=1 ? ["type","listen"] : b===2 ? ["type","gap","listen"] : ["type","gap","say","type"];
  if (it.boss) opts = ["type","listen","type"];
  opts = opts.filter(t=>feasible(t,w));
  const notSame = opts.filter(t=>t!==M.lastType);
  const pool = notSame.length ? notSame : opts;
  return pool.length ? pool[rnd(pool.length)] : "type";
}
function feasible(t,w){
  if (t==="listen") return HAS_TTS;
  if (t==="say") return srOK;
  if (t==="gap") return gapMatch(w)!==null;
  return true;
}
function gapMatch(w){
  const c = coreOf(w); if (!c || !w.ex) return null;
  const re = new RegExp("(^|[^A-Za-z'])(" + escRe(c) + ")(?![A-Za-z])","i");
  const m = w.ex.match(re); if (!m) return null;
  const start = m.index + m[1].length;
  return {before:w.ex.slice(0,start), word:m[2], after:w.ex.slice(start+m[2].length)};
}

function doFixType(val){
  const it = M.queue[M.i];
  let res = checkSentence(it.s, val);
  if (norm(val)===norm(fillN(it.s.bad))) res = {ok:false};
  $("#ans").blur();
  if (res.ok) S.stats.fixRight++;
  resolveSent(res.ok, {typo:res.typo, cap:res.cap, given:val, fix:true});
}

/* ---------- Auswerten ---------- */
function resolveWord(ok, opts={}){
  if (M.answered) return; M.answered = true;
  const it = M.queue[M.i], w = it.w;
  updateWord(w, ok, "mission", M.wrongSet.has(w.id) || M.hintUsed || it.fresh);
  afterAnswer(ok, it);
  if (!ok){ M.wrongSet.add(w.id); if (!M.missed.includes(w.en)) M.missed.push(w.en); }
  showSheet(ok, {en:w.en, de:w.de, say:sayText(w), tip: !ok && w.tip ? w.tip : "", ...opts});
}
function resolveSent(ok, opts={}){
  if (M.answered) return; M.answered = true;
  const it = M.queue[M.i], s = it.s;
  M.sentTotal++; if (ok) M.sentOk++;
  updateSent(s, ok, it.retry);
  afterAnswer(ok, it);
  showSheet(ok, {en:fillN(s.en), de:fillN(s.de), say:fillN(s.en), tip: ok ? "" : (s.tip||""), ...opts});
}

function afterAnswer(ok, it){
  if (ok){
    M.right++; M.combo++; M.best = Math.max(M.best,M.combo); S.stats.bestCombo = Math.max(S.stats.bestCombo, M.combo);
    const gain = (it.kind==="word" ? 10 : 15) + Math.min(M.combo,10) - (M.hintUsed?6:0);
    M.xp += gain; addXP(gain);
    sfx(M.mode==="boss"?"hit":"good");
    const el = $("#card .card");
    if (el){ const [x,y]=centerOf(el); burst(x,y,M.combo>=5?60:34); floatXP(el,"+"+gain); }
    gullReact(true);
    if (M.mode==="boss"){ M.boss.hp--; const a=$("#crab"); a.classList.remove("hit"); void a.getBoundingClientRect(); a.classList.add("hit"); const [x,y]=centerOf(a); burst(x,y,30,["#EF4D67","#FF8A3D","#F2B632"]); renderBoss(); }
  } else {
    M.wrong++; M.combo = 0; sfx("bad"); gullReact(false);
    if (navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
    if (M.mode==="boss"){ M.boss.shields--; renderBoss(); }
    else if (!it.retry){
      const pos = Math.min(M.i+4, M.queue.length);
      const again = it.kind==="word" ? {kind:"word", w:it.w, retry:true, type:"type"} : {kind:it.kind==="fix"?"fix":"sent", s:it.s, retry:true, type: it.kind==="fix" ? "fixtap" : "puzzle"};

}

/* ---------- Spracherkennung ---------- */
let REC = null;
function startListening(){
  const it = M.queue[M.i], w = it.w;
  const fallback = () => { srOK = false; it.type = "type"; renderWord(it); toast("Das Mikro geht hier nicht. Schreib das Wort stattdessen."); };
  if (!SR) return fallback();
  try {
    if (REC) { try{ REC.abort(); }catch(e){} }
    REC = new SR(); REC.lang = "en-GB"; REC.interimResults = false; REC.maxAlternatives = 5;
    const mic = $("#micBtn"), heard = $("#heard");
    mic.classList.add("listening"); heard.textContent = "Ich höre zu …";
    REC.onresult = e => {
      mic.classList.remove("listening");
      const alts = Array.from(e.results[0]).map(a=>a.transcript);
      const {exact} = answerForms(w);
      const targets = [...exact].concat([norm(sayText(w))]);
      const best = Math.max(...alts.flatMap(a=>targets.map(t=>similar(a,t))));
      if (best >= .75){ S.stats.say++; save(); resolveWord(true, {}); }
      else { M.sayTries++; heard.innerHTML = `Ich habe <b>„${esc(alts[0]||"…")}“</b> verstanden. Versuch's nochmal!`; if (M.sayTries>=3) resolveWord(false, {}); }
    };
    REC.onerror = e => {
      mic.classList.remove("listening");
      if (["not-allowed","service-not-allowed","audio-capture","network","language-not-supported"].includes(e.error)) fallback();
      else heard.textContent = e.error==="no-speech" ? "Ich habe nichts gehört. Tipp nochmal aufs Mikro!" : "Hat nicht geklappt. Versuch's nochmal!";
    };
    REC.start();
  } catch(e){ fallback(); }
}

    ${slept?`<div class="panel" style="flex-direction:row;align-items:center"><div style="width:56px;flex:none">${myGull({sleep:true})}</div><div><b>Tagesziel erreicht!</b><div class="muted" style="font-size:.88rem">${esc(G())} ist müde und schläft jetzt. Morgen geht's weiter.</div></div></div>`:""}

function pinGo(){
  const v = ($("#pinIn").value||"").trim();
  if (!/^\d{4}$/.test(v)){ $("#pinMsg").textContent = "Bitte genau 4 Ziffern eingeben."; return; }
  if (!S.pin){ S.pin = v; save(); }
  else if (S.pin !== v){ $("#pinMsg").textContent = "Die PIN stimmt nicht."; $("#pinIn").value=""; return; }
  pinUntil = Date.now() + 15*60*1000;
  const f = pinNext; pinNext = null; if (f) f();
}

  importCode: () => {
    const msg = $("#impMsg");
    try {
      let raw = $("#impCode").value.trim();
      const m = raw.match(/([A-Za-z0-9+/=]{200,})\s*$/); if (m) raw = m[1];
      const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!data || typeof data.words!=="object") throw 0;
      const pin = S.pin; S = Object.assign(blank(), data, {pin}); save(); msg.textContent = `Geladen: ${Object.keys(S.words).length} Wörter, ${S.xp} XP.`;
    } catch(e){ msg.textContent = "Der Code ist ungültig. Bitte vollständig kopieren und erneut einfügen."; }
  },
  resetAsk: () => { $("#resetBox").innerHTML = `<p style="margin:0 0 8px">Wirklich alles löschen? Fortschritt, Möwe und Abzeichen gehen verloren.</p><div class="row"><button class="btn btn-ghost" data-act="openParents" style="flex:1">Abbrechen</button><button class="btn btn-bad" data-act="resetDo" style="flex:1">Ja, löschen</button></div>`; },
  resetDo: () => { try{ localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); }catch(e){} S = null; OB.color = 0; renderOnboard(true); show("onboard"); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && (e.target.id==="nameIn" || e.target.id==="gullIn")){ const b=$("[data-act=onboardGo]"); if (b) ACT.onboardGo(b); } });

/* ============ START ============ */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e) {}
if (S && S.name && S.gull) show("home");
else if (S && S.name){ renderOnboard(false); show("onboard"); }
else { renderOnboard(true); show("onboard"); }
})();

</script>

</body>
</html>
