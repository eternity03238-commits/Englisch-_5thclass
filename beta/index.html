<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8ED2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Möwenflug">
<link rel="icon" type="image/svg+xml" href="../icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Möwenflug Beta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700&family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column on a sunny seaside; the child's own seagull lives on a pier post at the top of home; feedback slides up from the bottom */
*,*::before,*::after{box-sizing:border-box}
:root{
  --sky:#D6F0FF; --sky-2:#F3FAFF; --panel:#FFFFFF; --panel-2:#EAF5FB; --line:#BCDCEC;
  --ink:#0E2A47; --muted:#4E6B85; --dim:#8DA5B9;
  --flame:#FF8A3D; --flame-2:#FF5E5B; --good:#1FB97E; --good-ink:#FFFFFF; --bad:#EF4D67; --bad-ink:#FFFFFF; --ice:#0B95C2; --navy:#16406B;
  --shadow:0 4px 0 rgba(14,42,71,.14);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,#8ED2FF 0,#C4EAFF 30%,#E4F6FF 60%,#F4FBFF 100%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:60}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.muted{color:var(--muted)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:1.02rem;transition:transform .12s ease;font-family:var(--f-display);letter-spacing:.01em}
.btn:active{transform:translateY(2px) scale(.98)}
.btn-main{background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 5px 0 #C9443F,0 10px 24px rgba(255,94,91,.3)}
.btn-soft{background:var(--panel);border:2px solid var(--line);color:var(--navy);box-shadow:var(--shadow)}
.btn-ghost{background:rgba(255,255,255,.6);border:2px solid var(--line);color:var(--muted)}
.btn-good{background:var(--good);color:var(--good-ink);box-shadow:0 5px 0 #148A5C}
.btn-bad{background:var(--bad);color:var(--bad-ink);box-shadow:0 5px 0 #B32E45}
.btn-ice{background:var(--ice);color:#fff;box-shadow:0 5px 0 #08698A}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:22px;height:22px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--navy)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.field,.answer{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--sky-2);color:var(--ink);font:inherit;font-size:1.15rem;padding:0 16px}
.answer{font-size:1.25rem;font-weight:600;min-height:60px}
.field::placeholder,.answer::placeholder{color:var(--dim)}
.answer.shake{animation:shake .4s;border-color:var(--bad)}
.tip{border-left:4px solid var(--flame);background:#FFF3E8;border-radius:4px 12px 12px 4px;padding:10px 12px;font-size:.92rem;color:var(--ink)}
.tip b{color:#C4551A}
.seg{display:flex;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--navy);box-shadow:inset 0 0 0 2px var(--ice)}
[hidden]{display:none!important}

/* seagull */
.gull{display:block;overflow:visible;width:100%;height:auto}
.gull .bob{animation:bob 2.6s ease-in-out infinite}
.gull.happy .wing{animation:flap .25s ease-in-out 4;transform-box:fill-box;transform-origin:80% 30%}
.gull.sleep .bob{animation:none}
.gull .wobble{animation:wobble 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.gull .spark{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.gull.chick .bob{animation:bob 1.8s ease-in-out infinite}
.zz{font-family:var(--f-display);font-weight:700;fill:var(--navy);animation:zz 2.4s ease-in-out infinite}

/* onboarding */
.hero{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95;color:var(--navy);text-shadow:0 4px 0 rgba(255,255,255,.8)}
.hero span{color:var(--flame-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--navy)}

/* home */
.topbar{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;padding:3px}
.who{min-width:0}
.who b{display:block;font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}
.who small{color:var(--muted);font-size:.8rem}
.bubble{position:absolute;left:10px;top:10px;max-width:calc(100% - 118px);background:rgba(255,255,255,.95);border-radius:16px;padding:7px 10px;font-weight:600;color:var(--navy);box-shadow:0 6px 18px rgba(14,42,71,.18);display:flex;gap:8px;align-items:center}
.bubble .who-says{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bubble .en{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.bubble small{display:block;font-size:.74rem;line-height:1.25}
.bubble .speak{width:34px;height:34px}
.route{position:relative;height:34px}
.route .track{position:absolute;left:8px;right:8px;top:15px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.route .done{position:absolute;left:8px;top:15px;height:4px;border-radius:2px;background:var(--ice)}
.route .stop{position:absolute;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.route .stop.on{border-color:var(--ice);background:var(--ice)}
.route .stop.goal{width:18px;height:18px;margin-left:-9px;top:8px;border-color:var(--flame)}
.route .plane{position:absolute;top:-4px;width:40px;margin-left:-20px;transition:left .8s}
.lesson-btn{width:100%;padding:18px 20px;border-radius:22px;text-align:left;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 6px 0 #C9443F,0 14px 30px rgba(255,94,91,.28);position:relative;overflow:hidden}
.lesson-btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 3.2s ease-in-out infinite}
.lesson-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C9443F}
.lesson-btn b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.lesson-btn small{display:block;font-weight:600;opacity:.95;margin-top:3px}
.lesson-btn .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.lesson-btn.done{background:linear-gradient(180deg,#5DB6DD,#2E8FBE);box-shadow:0 6px 0 #1F6E95}
.lesson-btn.done::after{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow);min-width:0}
.tile:active{transform:scale(.98)}
.tile .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tile b{font-family:var(--f-display);font-size:1.08rem;color:var(--navy)}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile.locked{opacity:.65}
.t-red .ti{background:#FFE4E8;color:var(--bad)}
.t-ice .ti{background:#DDF2FA;color:var(--ice)}
.t-flame .ti{background:#FFEBDD;color:#D9621B}
.t-good .ti{background:#DCF6EB;color:#11925F}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.foot .btn{min-height:42px;font-size:.88rem;padding:0 14px;border-radius:12px}
.storm{display:flex;gap:14px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(160deg,#3C5A80,#22395A);color:#fff;border:2px solid #22395A;box-shadow:var(--shadow)}
.storm .label{color:#FFD45A}
.storm small{color:#D3E0EE}
.storm .count{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;color:#FFD45A}
.lh{width:64px;display:block}
.daydots{display:flex;gap:4px}
.daydots span{flex:1;text-align:center;font-size:.66rem;font-weight:700;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.12);color:#D3E0EE;min-width:0}
.daydots span.now{background:#FFD45A;color:#22395A}
.daydots span.past{background:rgba(31,185,126,.45);color:#fff}
.ampel{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.ampel i{width:12px;height:12px;border-radius:50%}
.storm .btn-soft{background:#fff;color:var(--navy);border-color:#fff}

/* lesson */
.mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:6px;background:linear-gradient(rgba(196,234,255,.95) 70%,rgba(196,234,255,0))}
.mbar .close{width:42px;height:42px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--navy)}
.prog{flex:1;height:14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--flame),var(--good));border-radius:999px;transition:width .5s ease}
.combo{min-width:62px;justify-content:center}
.combo.hot{border-color:var(--flame);color:#D9621B}
.coach{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.coach .gmini{width:64px;flex:none}
.coach .say{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-weight:600;color:var(--navy);box-shadow:var(--shadow)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;margin-top:12px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:var(--shadow)}
.ask{font-size:.95rem;color:var(--muted);font-weight:600}
.stagebadge{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:#08799E;border:1.5px solid var(--line)}
.big{font-family:var(--f-display);font-size:clamp(1.8rem,8.5vw,2.5rem);font-weight:700;line-height:1.15;word-break:break-word;color:var(--navy)}
.de-big{font-size:clamp(1.35rem,6.2vw,1.85rem);font-weight:700;line-height:1.25;color:var(--ink)}
.ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS",var(--f-body);color:#08799E;font-size:1rem}
.speak{width:50px;height:50px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ice)}
.speak.lg{width:104px;height:104px;margin:4px auto;background:#E3F5FC;border-color:var(--ice)}
.speak.lg .icon{width:44px;height:44px}
.speak.playing{animation:pulse .8s ease infinite}
.example{background:var(--panel-2);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.example p{margin:0}
.example .de{color:var(--muted);font-size:.9rem}
.sentence{font-size:1.25rem;line-height:1.6;font-weight:600}
.sentence .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--flame);color:#D9621B}
.hint-line{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#08799E;text-align:center;font-size:1.2rem;min-height:1.4em}
.mic{width:120px;height:120px;border-radius:50%;margin:4px auto;display:grid;place-items:center;background:linear-gradient(180deg,#FFA25A,var(--flame-2));color:#fff;box-shadow:0 6px 0 #C9443F}
.mic .icon{width:52px;height:52px}
.mic.listening{animation:pulse 1s ease infinite;background:var(--good)}
.heard{text-align:center;color:var(--muted);min-height:1.4em}
.answer-line{min-height:70px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;border-radius:16px;border:2px dashed var(--line);background:var(--sky-2)}
.answer-line .end{align-self:center;font-size:1.3rem;font-weight:700;color:var(--muted)}
.tiles-pool,.badline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wtile{min-height:46px;padding:0 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #BCDCEC;color:var(--navy)}
.wtile:active{transform:translateY(3px);box-shadow:0 1px 0 #BCDCEC}
.wtile.placed{background:#E3F5FC;border-color:var(--ice);box-shadow:none}
.wtile.used{visibility:hidden}
.wtile.hit{background:var(--good);color:#fff;border-color:var(--good)}
.wtile.miss{background:var(--bad);color:#fff;border-color:var(--bad)}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(14,42,71,.15)}
.sheet:not(.show){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.sheet.show{transform:none}
.sheet.ok{background:#E2F8EE;border-top:4px solid var(--good)}
.sheet.no{background:#FFE9EC;border-top:4px solid var(--bad)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.sheet.ok h3{color:#0E7C51}
.sheet.no h3{color:#B52A43}
.sheet .sol{display:flex;align-items:center;gap:12px}
.sheet .sol b{font-size:1.15rem;color:var(--navy)}
.sheet .sol small{display:block;color:var(--muted)}
.sheet .yours{font-size:.9rem;color:var(--muted)}
.sheet .yours s{color:#B52A43}

/* flashcards */
.fc{display:grid;perspective:1200px;margin-top:10px}
.fc-inner{display:grid;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px 20px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;
  background:#fff;border:2px solid var(--line);box-shadow:0 14px 30px rgba(14,42,71,.14)}
.fc-back{transform:rotateY(180deg);border-color:var(--ice);background:#F2FBFF}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate .btn{min-height:64px;font-size:1.1rem}
.deck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.deck:active{transform:scale(.99)}
.deck b{display:block;color:var(--navy)}
.deck small{color:var(--muted);font-size:.82rem}
.deck .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:#08799E}
.deck.hot{border-color:var(--flame)}
.deck[disabled]{opacity:.45}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* boss */
.boss-box{display:flex;align-items:center;gap:12px;background:#FFF0F2;border:2px solid #F7B7C2;border-radius:20px;padding:10px 14px;margin-top:10px}
.crab{width:84px;height:70px;flex:none;animation:bob 2s ease-in-out infinite}
.crab.hit{animation:hit .45s ease}
.hp{height:16px;border-radius:999px;background:#fff;border:1.5px solid #F7B7C2;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--flame));transition:width .4s ease}
.shields{display:flex;gap:4px;color:var(--ice)}
.shields .off{opacity:.2}

/* summary, lists, parents */
.trophy{text-align:center;padding-top:6px}
.stars-row{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars-row svg{width:56px;height:56px}
.stars-row .s{animation:starIn .5s cubic-bezier(.2,.9,.3,1.5) both}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;color:#D9621B;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
details.pl{background:var(--panel);border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
details.pl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;color:var(--navy)}
details.pl summary::-webkit-details-marker{display:none}
details.pl summary .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;flex:none}
details.pl[open] summary{border-bottom:1.5px solid var(--line)}
.wlist{display:flex;flex-direction:column}
.witem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--panel-2)}
.witem:last-child{border-bottom:0}
.witem .txt{flex:1;min-width:0}
.witem .txt b{display:block;color:var(--navy)}
.witem .txt small{color:var(--muted)}
.witem.unknown .txt b{color:var(--dim)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--flame)}
.witem .speak{width:38px;height:38px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:var(--shadow)}
.bdg .e{font-size:2.2rem;filter:grayscale(1) opacity(.35)}
.bdg.got{border-color:var(--flame);background:#FFF6EE}
.bdg.got .e{filter:none}
.bdg b{color:var(--navy)}
.bdg small{color:var(--muted);font-size:.78rem}
.diploma{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px dashed var(--line);background:#fff}
.diploma.got{border:2px solid #E8B64A;background:linear-gradient(135deg,#FFF8DF,#FFFFFF)}
.diploma .seal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.diploma.got .seal{background:#E8B64A;color:#fff}
.postcard{background:#FFFDF6;border:2px solid #E8D9A8;border-radius:16px;padding:18px 18px 18px;box-shadow:var(--shadow);font-family:var(--f-display);font-size:1.15rem;line-height:1.5;color:var(--navy);position:relative}
.postcard .stamp{float:right;width:56px;height:64px;margin:0 0 6px 10px;border:2px dashed #E8B64A;border-radius:6px;display:grid;place-items:center;background:#FFF3C9;padding:4px}
.postcard p{margin:0 0 6px}
.panel textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--sky-2);color:var(--ink);font:inherit;font-size:.8rem;padding:10px;word-break:break-all}
.cal{display:flex;gap:4px;flex-wrap:wrap}
.cal i{width:18px;height:18px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.cal i.on{background:var(--good);border-color:var(--good)}
.problem{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--panel-2)}
.problem:last-child{border-bottom:0}
.problem span{color:#B52A43;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:#FFE9EC;border:1.5px solid #F7B7C2;color:#B52A43}
.chip.ok{background:#E2F8EE;border-color:#9EE3C5;color:#0E7C51}
.pin{font-size:2rem;letter-spacing:.6em;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:70;background:var(--navy);color:#fff;font-weight:700;padding:12px 20px;border-radius:16px;box-shadow:0 10px 30px rgba(14,42,71,.3);transition:transform .4s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.xpfloat{position:fixed;z-index:65;font-family:var(--f-display);font-weight:700;color:#D9621B;font-size:1.4rem;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 #fff}

/* harbor home */
.harbor-wrap{position:relative;height:300px;border-radius:28px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);background:#9AD8FF}
.harbor{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.harbor::-webkit-scrollbar{display:none}
.harbor-in{position:relative;height:100%;width:1235px}
.harbor-in svg.world{display:block;width:100%;height:100%}
.world .bld{cursor:pointer}
.world .bld:active{opacity:.85}
.world .cl{animation:cloud 60s linear infinite}
.world .cl.c2{animation-duration:85s}
.world .cl.c3{animation-duration:110s}
.world .wv{animation:wave 6s ease-in-out infinite}
.world .wv.v2{animation-duration:8s;animation-direction:reverse}
.world .rain{animation:rain .6s linear infinite}
.world .wheel{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
.world .beam{transform-box:view-box;animation:beam 5s ease-in-out infinite}
.world .twinkle{animation:twinkle 3s ease-in-out infinite}
.hgull{position:absolute;width:74px;cursor:pointer;transition:left 1.2s cubic-bezier(.5,0,.3,1),top 1.2s}
.hgull.flying{animation:hopfly 1.2s ease-in-out}
.harbor-wrap .bubble{z-index:3}
.swipehint{position:absolute;right:10px;top:12px;z-index:3;background:rgba(255,255,255,.85);color:var(--navy);font-weight:700;font-size:.72rem;padding:4px 9px;border-radius:999px;pointer-events:none;transition:opacity .6s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.harbor-wrap.storm3 .flash{animation:flash 7s infinite}
.stagebar{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
.stagebar b{font-family:var(--f-display);color:var(--navy);white-space:nowrap}
.stagebar small{font-size:.78rem;text-align:right;line-height:1.2}
.minibar{flex:1;height:10px;border-radius:999px;background:#DCEBF3;overflow:hidden;min-width:30px}
.minibar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ice),var(--good));transition:width .8s}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:20px;color:#fff;min-height:96px}
.bigbtn b{font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.bigbtn small{font-size:.8rem;opacity:.95;line-height:1.25}
.bigbtn .icon{width:26px;height:26px}
.bigbtn:active{transform:translateY(3px)}
.b-good{background:linear-gradient(180deg,#2FCB8E,#17A570);box-shadow:0 5px 0 #0F7E54}
.b-ice{background:linear-gradient(180deg,#22AEDB,#0A88B3);box-shadow:0 5px 0 #086A8C}
.b-sent{background:linear-gradient(180deg,#9A7BE6,#7656CC);box-shadow:0 5px 0 #553A9E;gap:12px}
/* gull life */
.gull .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.gull .head{transform-box:fill-box;transform-origin:30% 85%;animation:tilt 9s ease-in-out infinite}
.gull.happy .bob{animation:hop .45s ease-in-out 2}
.gull.confused .head{animation:conf 1s ease-in-out}
.gmini{position:relative}
.gmini .fish{position:absolute;left:50%;top:-6px;width:30px;margin-left:-15px;animation:fishup 1s ease-out forwards;pointer-events:none}
.gmini .qm{position:absolute;right:-4px;top:-10px;font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--bad);animation:pop .3s}
/* wardrobe & place */
.ward-hero{width:190px;margin:0 auto}
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.acc .pv{width:54px;flex:none}
.acc b{display:block;color:var(--navy)}
.acc small{color:var(--muted);font-size:.82rem}
.acc .st{margin-left:auto;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);flex:none}
.acc.on{border-color:var(--good);background:#F0FBF6}
.acc.on .st{background:var(--good);color:#fff}
.acc.locked{opacity:.6}
.place-head{display:flex;align-items:center;gap:12px}
.place-head .dot{width:22px;height:22px}
.bar{height:12px;border-radius:999px;background:#DCEBF3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tilt{0%,78%,100%{transform:rotate(0)}82%,90%{transform:rotate(-9deg)}}
@keyframes conf{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(16deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes fishup{0%{opacity:0;transform:translateY(20px) rotate(-20deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px) rotate(20deg)}}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(1500px)}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flash{0%,90%,93%,100%{opacity:0}91%,94%{opacity:.75}}
@keyframes hopfly{0%,100%{transform:translateY(0)}50%{transform:translateY(-60px) rotate(-6deg)}}

/* journal & album */
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:#FFFDF6;border:2px solid #E8D9A8;box-shadow:var(--shadow);text-align:left;min-width:0}

.pc em{position:absolute;right:-6px;top:-8px;font-style:normal;font-weight:700;font-size:.72rem;background:var(--flame-2);color:#fff;padding:3px 8px;border-radius:999px;transform:rotate(8deg);box-shadow:var(--shadow)}
.pc.new{animation:pop .5s}

.pc small{color:var(--muted);font-size:.78rem;padding:0 2px}
.newdot{display:inline-block;margin-left:6px;font-size:.75rem;background:var(--flame-2);color:#fff;padding:2px 8px;border-radius:999px}
.album{background:#FFFDF6;border:2px solid #E8D9A8;border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(232,217,168,.35) 27px 28px)}
.stkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.stkcell{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.stkcell b{font-size:.8rem;color:var(--navy);line-height:1.2}
.stkcell small{font-size:.7rem;color:var(--muted);line-height:1.2}
.stkcell.locked b{color:var(--dim)}
.stk{width:72px;height:72px;display:block;transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 2px rgba(14,42,71,.18))}
.stk.empty{filter:none;transform:none}
.stk.fly{animation:stickfly .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stickfly{0%{transform:translate(60px,-80px) scale(2.2) rotate(40deg);opacity:0}60%{opacity:1}100%{transform:rotate(var(--r,0deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes pop{from{opacity:.4;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hit{0%{transform:translateX(0);filter:none}30%{transform:translateX(10px) rotate(6deg);filter:brightness(1.6)}60%{transform:translateX(-6px)}100%{transform:none}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.tiles{gap:8px}.tile{padding:12px}}
.deck.star{border-color:var(--flame);background:linear-gradient(135deg,#FFF6EC,#FFFFFF 60%)}
.minisum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--ink);font-weight:600}
.minisum i,.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cchip{align-self:center;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:700;background:#E8F3F9;color:#16406B;border:1.5px solid #C3DCEA}
.cchip.bad{background:#FFE9EC;border-color:#F7B7C2;color:#B52A43}
.cchip.new{background:#F0EAFF;border-color:#CDBDF5;color:#5B3DB0}
.result{display:flex;align-items:center;gap:16px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.ring{width:118px;height:118px;flex:none}
.ringv{animation:ringIn 1.1s cubic-bezier(.3,.8,.3,1) .2s forwards}
@keyframes ringIn{to{stroke-dashoffset:var(--off)}}
.panel.escape{border-color:var(--good);background:#F1FCF7}
.sbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#EEF4F8}
.sbar i{display:block;height:100%;transition:width .6s}

.wd{width:20px;height:20px;border-radius:50%;border:0;padding:0;opacity:0;transform:scale(.2);animation:dotIn .35s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.wd:active{transform:scale(1.3)}
@keyframes dotIn{to{opacity:1;transform:scale(1)}}
.btn.mini{min-height:40px;padding:6px 12px;font-size:.88rem}
@media (prefers-reduced-motion:reduce){.wd,.ringv{animation-duration:.01s}}
.exclock{font-variant-numeric:tabular-nums;font-weight:700;background:#16406B;color:#fff;border-color:#16406B;min-width:70px;justify-content:center}

@keyframes pulse{50%{transform:scale(1.07)}}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px dashed #C9DCEA;padding-bottom:10px}
.exhead b{display:block;color:var(--navy);font-family:var(--f-display);font-size:1.05rem}

.exhead>span{text-align:right;font-weight:700;color:#08799E;font-variant-numeric:tabular-nums;flex:none}
.card.handed{opacity:.55;transform:translateY(-6px) scale(.98);transition:all .25s}
.paper{display:flex;flex-direction:column;gap:12px;background:#FFFEF8;border:2px solid #E6E0C8;border-radius:14px;padding:18px 16px 18px 26px;box-shadow:var(--shadow);position:relative;
  background-image:linear-gradient(90deg,transparent 14px,#F3B3B3 14px,#F3B3B3 16px,transparent 16px),repeating-linear-gradient(#FFFEF8 0 29px,#DCE7F2 29px 30px)}
.phead{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.gstamp{flex:none;width:118px;height:118px;border-radius:50%;border:5px solid var(--h);color:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg) scale(2.4);opacity:0;background:rgba(255,255,255,.6)}
.gstamp.in{animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{to{transform:rotate(-12deg) scale(1);opacity:1}}

.parts{display:flex;flex-direction:column;gap:8px}

@media (prefers-reduced-motion:reduce){.gstamp{transform:rotate(-12deg);opacity:1}.gstamp.in{animation:none}}
.codebox{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em;font-size:1rem;color:var(--navy);background:#EAF6FC;border:2px dashed #9CCFE6;border-radius:12px;padding:10px 12px;text-align:center;word-break:break-all;user-select:all}

.wc-hero{gap:10px}

.wc-res b{font-family:var(--f-display);font-size:1.7rem;line-height:1}.wc-res small{font-size:.75rem;color:#5E6A80;text-align:center}
.wc-res .ok b{color:#1F9E6A}.wc-res .auto b{color:#0B95C2}.wc-res .todo b{color:#E2552B}
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.unit.cur{box-shadow:0 0 0 3px #3FBF83,var(--lift)}
.unit-art{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:#DDEFFA}
.unit-art svg{display:block;width:100%;height:100%}
.unit-ill{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(180deg,#CDEBFA,#FDF1DC)}.unit-ill img{width:82%;height:82%;object-fit:contain}
.unit-fog{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.95),rgba(235,242,248,.85) 60%,rgba(220,232,242,.9));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.unit-lock{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem}
.unit-txt{display:flex;flex-direction:column;gap:2px;min-width:0}.unit-txt b{color:var(--navy)}.unit-txt small{color:#5E6A80}
.unit-btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.unit-btns:empty{display:none}
/* ================= 3D-SPIELWELT ================= */
:root{
  --line:#C7E3F2; --panel-2:#EEF8FD;
  --clay-hi:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.08);
  --lift:0 2px 0 #CFE3EF, 0 6px 0 #B7D3E4, 0 14px 24px rgba(14,42,71,.14);
  --shadow:0 4px 0 #BBD6E6, 0 10px 22px rgba(14,42,71,.10);
}
body{background:radial-gradient(120% 60% at 85% -10%,#FFF6C9 0,rgba(255,246,201,0) 45%),linear-gradient(180deg,#3FB7F5 0,#7FD3FF 28%,#BDEBFF 58%,#E9F9FF 100%) fixed;background-color:#BDEBFF}
.display{text-shadow:0 2px 0 rgba(255,255,255,.65)}
/* Karten wie aus weichem Kunststoff */
.panel,.card,.tile,.stat,.stagebar{border:0;border-radius:22px;background:linear-gradient(180deg,#FFFFFF,#F6FBFE);box-shadow:var(--lift),inset 0 1px 0 #fff}
.card{border-radius:28px}
/* Knöpfe: knubbelig, mit Licht oben und dicker Kante unten */
.btn{border-radius:18px;transition:transform .1s ease,box-shadow .1s ease,filter .1s}
.btn:active{transform:translateY(4px)}
.btn-main{background:linear-gradient(180deg,#FFB561 0,#FF8A3D 45%,#FF5E5B 100%);box-shadow:var(--clay-hi),0 6px 0 #C2413C,0 12px 22px rgba(255,94,91,.35);text-shadow:0 1px 0 rgba(150,40,20,.35)}
.btn-main:active{box-shadow:var(--clay-hi),0 2px 0 #C2413C,0 4px 10px rgba(255,94,91,.3)}
.btn-good{background:linear-gradient(180deg,#4FE0A4,#1FB97E);box-shadow:var(--clay-hi),0 6px 0 #11835A}
.btn-good:active{box-shadow:var(--clay-hi),0 2px 0 #11835A}
.btn-bad{background:linear-gradient(180deg,#FF7A8E,#EF4D67);box-shadow:var(--clay-hi),0 6px 0 #B02B44}
.btn-bad:active{box-shadow:var(--clay-hi),0 2px 0 #B02B44}
.btn-ice{background:linear-gradient(180deg,#3FC6F0,#0B95C2);box-shadow:var(--clay-hi),0 6px 0 #07698A}
.btn-ice:active{box-shadow:var(--clay-hi),0 2px 0 #07698A}
.btn-soft{border:0;background:linear-gradient(180deg,#fff,#EEF7FC);box-shadow:inset 0 1px 0 #fff,0 4px 0 #BCD8E8,0 8px 16px rgba(14,42,71,.08)}
.btn-soft:active{box-shadow:inset 0 1px 0 #fff,0 1px 0 #BCD8E8}
.btn-ghost{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.field,.answer{border:0;background:#F1F8FC;box-shadow:inset 0 3px 0 rgba(14,42,71,.08),0 0 0 2px #D3E8F3}
.field:focus,.answer:focus{box-shadow:inset 0 3px 0 rgba(14,42,71,.08),0 0 0 3px var(--ice);outline:none}
.seg{border:0;background:#E3F1F9;box-shadow:inset 0 2px 0 rgba(14,42,71,.07)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 3px 0 #BCD8E8;color:var(--navy)}
.pill{border:0;background:#fff;box-shadow:0 3px 0 #BCD8E8}
.tile{min-height:112px;transition:transform .12s}
.tile:active{transform:translateY(3px)}
.tile .ti{width:42px;height:42px;border-radius:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 3px 0 rgba(14,42,71,.08)}
.deck{border:0!important;border-radius:20px!important;background:linear-gradient(180deg,#fff,#F5FAFD)!important;box-shadow:0 4px 0 #BCD8E8,0 8px 18px rgba(14,42,71,.08)!important}
.deck:active{transform:translateY(3px)}
.mbar .close{border:0;box-shadow:0 4px 0 #BCD8E8;background:#fff}
.mbar .prog{height:16px;border-radius:999px;background:#fff;box-shadow:inset 0 2px 0 rgba(14,42,71,.1)}
.mbar .prog i{border-radius:999px;background:linear-gradient(180deg,#5BE3A8,#1FB97E)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.sheet{border-radius:28px 28px 0 0}

/* ---------- Startseite: Spiel-HUD ---------- */
.hud{display:flex;align-items:center;gap:10px}
.hud-me{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;padding:0}
.hud .avatar{width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff,#DDF2FD);box-shadow:0 4px 0 #A9CFE3,0 8px 16px rgba(14,42,71,.15);padding:4px}
.hud .who b{font-size:1.12rem;color:#0E3460;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.hud .who small{color:#1D5B8A;font-weight:600}
.hud-chips{display:flex;gap:6px;flex:none}
.chip3d{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 10px 0 6px;border-radius:999px;background:linear-gradient(180deg,#fff,#EAF5FB);box-shadow:0 3px 0 #A9CFE3,0 6px 12px rgba(14,42,71,.12);font-family:var(--f-display);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.chip3d i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.95rem}
.c-flame i{background:#FFE6CF}
.c-fish i{background:#D9F1FC}
.c-lv{padding:0;width:44px;height:44px;justify-content:center}
.lvring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#FFB627 calc(var(--p,0)*1%),#E3EEF5 0)}
.lvring b{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem;color:#B5651D}
@media (max-width:380px){.hud .who small{display:none}.chip3d{padding:0 8px 0 4px}}

/* Hafen als Bühne */
.harbor-wrap{height:310px;border:0;border-radius:30px;box-shadow:0 6px 0 #6FB4D6,0 18px 30px rgba(14,42,71,.22),inset 0 0 0 3px rgba(255,255,255,.65)}
.stagebar{margin-top:-28px;margin-inline:14px;position:relative;z-index:4;padding:8px 12px;border-radius:999px}
.stagebar .minibar{height:14px;background:#E3EEF5;box-shadow:inset 0 2px 0 rgba(14,42,71,.1)}
.stagebar .minibar i{background:linear-gradient(180deg,#FFD36B,#FFA51F);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}

/* Großer Play-Knopf */
.play-btn{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:26px;text-align:left;color:#fff;
  background:linear-gradient(180deg,#FFC069 0,#FF8A3D 40%,#FF5E5B 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(160,40,30,.18),0 8px 0 #C2413C,0 18px 30px rgba(255,94,91,.38);transition:transform .1s,box-shadow .1s}
.play-btn:active{transform:translateY(6px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 2px 0 #C2413C,0 6px 12px rgba(255,94,91,.3)}
.play-btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.play-btn b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.05;text-shadow:0 2px 0 rgba(150,40,20,.3)}
.play-btn small{display:block;font-weight:600;opacity:.95;margin-top:4px;font-size:.88rem}
.play-ic{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#FFE3C9);box-shadow:0 4px 0 #D9622B,inset 0 -3px 0 rgba(0,0,0,.06);color:#FF5E5B;animation:playpulse 1.8s ease-in-out infinite}
.play-ic svg{width:30px;height:30px;margin-left:4px}
@keyframes playpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.play-btn.done{background:linear-gradient(180deg,#6CD3F7,#2E9FD0 60%,#1F82B3);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 8px 0 #186C95,0 18px 30px rgba(31,130,179,.3)}
.play-btn.done .play-ic{color:#1F82B3;box-shadow:0 4px 0 #186C95;animation:none}
.play-btn.done::after{display:none}

/* Drei runde Knöpfe */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.orb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 12px;border-radius:24px;color:#fff;text-align:center;min-width:0;transition:transform .1s,box-shadow .1s}
.orb:active{transform:translateY(5px)}
.orb-ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.1)}
.orb-ic svg{width:28px;height:28px}
.orb b{font-family:var(--f-display);font-size:1.05rem;line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.orb small{font-size:.72rem;opacity:.92;line-height:1.15}
.o-sent{background:linear-gradient(180deg,#B49AF2,#7C5AD6);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 #563AA6,0 12px 20px rgba(86,58,166,.3)}
.o-sent:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #563AA6}
.o-good{background:linear-gradient(180deg,#52E3A9,#17A570);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 #0E7C51,0 12px 20px rgba(14,124,81,.28)}
.o-good:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #0E7C51}
.o-ice{background:linear-gradient(180deg,#4CCDF4,#0A8DBB);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 #076A8C,0 12px 20px rgba(7,106,140,.28)}
.o-ice:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #076A8C}

/* Reise-Leiste */
.journey{width:100%;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:22px;text-align:left;background:linear-gradient(180deg,#fff,#F3F9FD);box-shadow:var(--lift)}
.journey:active{transform:translateY(3px)}
.journey .jtop{display:flex;align-items:center;gap:8px}
.journey .jtop b{font-family:var(--f-display);color:var(--navy);font-size:1.02rem}
.journey .jtop small{margin-left:auto;color:var(--muted);font-weight:600;font-size:.8rem;text-align:right}
.newdot{display:inline-block;background:var(--flame-2);color:#fff;font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:999px;margin-left:4px;animation:pulse 1.4s infinite}

/* Kompakte Testkarte */
.storm{border:0;border-radius:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #142A47,0 14px 24px rgba(14,42,71,.3)}
.tbar{width:100%;display:flex;align-items:center;gap:12px;color:#fff;text-align:left;padding:0}
.tbar .ticon{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:rgba(255,255,255,.14);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
.tbar .tmid{min-width:0;flex:1}
.tbar .tmid b{display:block;font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .tmid small{display:flex;align-items:center;gap:6px}
.tbar .tmid small i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tbar .count{font-size:2rem}
.tbar .chev{transition:transform .2s;opacity:.8}
.storm.open .tbar .chev{transform:rotate(180deg)}

.foot .btn{min-height:40px;font-size:.84rem}

/* Hafen: lebendige Details */
.world .boat{animation:sail linear infinite}
.world .boat .bob2{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.world .bird{animation:birdfly linear infinite}
.world .bird path{animation:flapw .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.world .jump{transform-box:fill-box;transform-origin:center;animation:fishjump 7s ease-in-out infinite;opacity:0}
.world .due{transform-box:fill-box;transform-origin:center bottom;animation:duebounce 1.4s ease-in-out infinite}
.world .flag{transform-box:fill-box;transform-origin:left center;animation:flagw 1.2s ease-in-out infinite alternate}
@keyframes sail{from{transform:translateX(-160px)}to{transform:translateX(1560px)}}
@keyframes birdfly{from{transform:translate(-80px,0)}50%{transform:translate(700px,-24px)}to{transform:translate(1480px,10px)}}
@keyframes flapw{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
@keyframes fishjump{0%,78%,100%{opacity:0;transform:translate(0,30px) rotate(-40deg)}80%{opacity:1}86%{transform:translate(18px,-26px) rotate(0)}92%{opacity:1;transform:translate(36px,24px) rotate(50deg)}93%{opacity:0}}
@keyframes duebounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes flagw{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1)}}
.hgull.happy .gull .bob{animation:hop .45s ease-in-out 2}

/* Belohnungen */
.lvbox{display:flex;flex-direction:column;gap:8px}
.lvline{display:flex;align-items:center;gap:10px}
.lvbadge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:#8A4A10;background:radial-gradient(circle at 35% 30%,#FFF4C2,#FFC43D);box-shadow:0 4px 0 #C98A12,inset 0 -3px 0 rgba(0,0,0,.08)}
.lvbar{flex:1;height:20px;border-radius:999px;background:#E3EEF5;box-shadow:inset 0 3px 0 rgba(14,42,71,.1);overflow:hidden}
.lvbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#FFD36B,#FFA51F);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);transition:width 1.2s cubic-bezier(.3,.8,.3,1)}
.lvup{align-items:center;text-align:center;background:linear-gradient(180deg,#FFF3C4,#FFD96B)!important;animation:lvup .7s cubic-bezier(.2,1.5,.4,1) both}
.lvup b{font-family:var(--f-display);font-size:1.7rem;color:#8A4A10;letter-spacing:.04em}
@keyframes lvup{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.chest{align-items:center;text-align:center;cursor:pointer}
.chest svg{width:130px;height:110px;overflow:visible}
.chest .lid{transform-box:fill-box;transform-origin:15% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.chest.opened .lid{transform:rotate(-38deg) translate(-6px,-10px)}
.chest:not(.opened) svg{animation:wobble 2s ease-in-out infinite}
.chest .glow{opacity:0;transition:opacity .4s}
.chest.opened .glow{opacity:1}
.floatxp{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:#FFB627;text-shadow:0 2px 0 #8A4A10,0 0 10px rgba(255,255,255,.8);animation:floatup 1s ease-out forwards}
.stars-row svg{width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(201,138,18,.45))}
.stat b{font-size:1.7rem}
@media (prefers-reduced-motion:reduce){.world .boat,.world .bird,.world .jump,.world .due,.world .flag,.play-ic,.chest svg{animation:none}}

/* Eltern-Zugang auf der Startseite */
.pdock{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(180deg,#2E5C8E,#16406B);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 6px 0 #0B2747,0 12px 22px rgba(14,42,71,.25)}
.pdock:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 2px 0 #0B2747}
.pdock .pd-ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:rgba(255,255,255,.14);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
.pdock b{display:block;font-family:var(--f-display);font-size:1.1rem}
.pdock small{display:block;opacity:.85;font-size:.8rem}
.pdock .pd-lock{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#FFD23F;box-shadow:0 3px 0 #C98A12;font-size:.95rem}
/* Elternbereich */
.ptabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:18px;background:#E3F1F9;box-shadow:inset 0 2px 0 rgba(14,42,71,.07);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ptabs button{min-height:42px;border-radius:14px;font-weight:700;font-size:.88rem;color:var(--muted);font-family:var(--f-display)}
.ptabs button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 3px 0 #BCD8E8}
.phero{flex-direction:row;align-items:center;gap:12px}
.ampel-l{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-weight:600;font-size:.88rem}
.ampel-l i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:20px;text-align:left;background:linear-gradient(180deg,#fff,#F3F9FD);box-shadow:var(--lift);min-width:0}
.pbtn:active{transform:translateY(3px)}
.pbtn span{font-size:1.4rem}
.pbtn b{font-family:var(--f-display);color:var(--navy);font-size:1.05rem}
.pbtn small{color:var(--muted);font-size:.78rem;line-height:1.25}
.tour{align-items:center;text-align:center;padding:26px 20px;gap:12px}
.tour-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 35% 30%,#fff,#DDF2FD);box-shadow:0 5px 0 #A9CFE3,0 10px 20px rgba(14,42,71,.12)}
.tour-dots{display:flex;gap:6px;margin-top:6px}
.tour-dots i{width:10px;height:10px;border-radius:50%;background:#D3E8F3}
.tour-dots i.on{background:var(--flame);width:26px;border-radius:999px}
a.btn{text-decoration:none}
/* ============ FRIEDRICH 2.0: Design-Tokens und Charakterkomponente ============ */
:root{
  --fr-navy:#0B1930; --fr-navy-2:#13284A; --fr-royal:#1768E8; --fr-sky:#72C8FF; --fr-gold:#E4B45C;
  --fr-orange:#FF9438; --fr-green:#21B879; --fr-ivory:#F7F4EC; --fr-slate:#A8BCD4;
  --fr-glass:rgba(11,25,48,.72); --fr-radius:20px; --fr-shadow:0 10px 30px rgba(0,0,0,.35);
  --fr-font:"Nunito",system-ui,sans-serif; --fr-font-head:"Baloo 2","Nunito",system-ui,sans-serif;
}
.fr{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;aspect-ratio:1/1;width:100%;max-width:100%;transform-origin:50% 92%;user-select:none;-webkit-user-select:none}
.fr{container-type:inline-size}.fr-fit{width:100%}.fr-xs{width:48px}.fr-sm{width:96px}.fr-md{width:180px}.fr-lg{width:min(360px,80vw)}
.fr-body{position:relative;width:100%;height:100%;transform-origin:50% 90%;animation:fr-breathe 3.2s ease-in-out infinite;z-index:1}
.fr-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.fr-frame{opacity:0}  /* harter Wechsel ohne Überblendung, sonst flackert die Figur kurz durchsichtig */
.fr-frame.on{opacity:1}
.fr-frame.on ~ .fr-base, .fr-body:has(.fr-frame.on) .fr-base{opacity:0}
.fr-shadow{position:absolute;left:50%;bottom:7%;width:46%;height:6%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),rgba(0,0,0,0));z-index:0;transition:transform .2s,opacity .2s}
.fr[data-pose="face"] .fr-shadow{display:none}
@keyframes fr-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
/* Zustände: nur Verschieben, Skalieren und höchstens 4° Neigung */
/* Alle Bewegungen setzen an der Fußlinie (50 % / 90 %) an, die Füße bleiben stehen. Nur Level Up springt. */
.fr-a-celebrate .fr-body{animation:fr-bounce .9s cubic-bezier(.3,1.3,.5,1)}
.fr-a-levelup .fr-body{animation:fr-hop-big 1.7s cubic-bezier(.3,1.4,.5,1)}
.fr-a-levelup .fr-shadow{animation:fr-shadow .9s ease}

/* ============ Bildschirme nach Entwurf v4 (nur Beta) ============ */
:root{--mw-cream:#FBF5EA;--mw-card:#FFFBF4;--mw-line:#EADFCB;--mw-navy:#13234A;--mw-teal:#0E5258;--mw-teal2:#0A3F44;--mw-coral:#EE6A4E;--mw-muted:#5E6478}

/* Unterer Bereich */

  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--mw-cream)}

.mw-logo,.mw-title,.mw-ptitle{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:700;color:var(--mw-navy);margin:0;text-align:center;line-height:1.05;text-wrap:balance}

  linear-gradient(var(--mw-coral),var(--mw-coral)) 50% 0/4px 9px no-repeat,

  background:radial-gradient(60% 6px at 50% 100%,var(--mw-coral) 0 98%,transparent) 50% 100%/62% 6px no-repeat;padding-bottom:10px;align-self:center}

  font-size:clamp(1.5rem, 1rem + 2vw, 3rem);overflow-wrap:anywhere;min-inline-size:0;white-space:normal}

/* Elternmenü */
.mw-hero-wrap{position:relative}

.mw-pill svg{width:22px;height:22px}
.mw-ptitle{flex:1;font-size:clamp(1.7rem,1.2rem + 2.4vw,2.3rem);padding:2px 10px 6px;text-align:center;
  background:radial-gradient(closest-side,rgba(255,250,240,.92),rgba(255,250,240,.6) 70%,transparent);border-radius:20px;
  text-decoration:underline var(--mw-coral) 4px;text-underline-offset:8px;margin-right:60px}
.mw-rows{gap:10px;padding-top:14px}
.mw-row{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px 12px;background:var(--mw-card);border:1.5px solid var(--mw-line);border-radius:22px;cursor:pointer;color:var(--mw-navy);text-align:left}
.mw-row b{flex:1;min-width:0;font:700 1.3rem/1.1 "Baloo 2",Nunito,sans-serif;overflow-wrap:anywhere}
.mw-go{width:46px;height:40px;flex:none;border-radius:999px;background:var(--mw-teal);color:#fff;display:grid;place-items:center}
.mw-go svg{width:24px;height:24px}
.mw-rows .mw-link{font-size:1rem;color:var(--mw-teal);text-decoration:underline;text-underline-offset:4px}

/* Menü-Hintergründe (menuBackgroundPlan): Bild füllt den Bildschirm, oben bleibt das Motiv frei */

#mwBack::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,245,234,0) 0,rgba(251,245,234,0) 24%,rgba(251,245,234,.18) 48%,rgba(251,245,234,.38) 100%)}
