  toggleSlow: () => { S.settings.slow = !S.settings.slow; save(); renderHome(); speak("Hello! This is my speed."); },
  say: b => speak(b.dataset.t, !!b.dataset.slow, b),
  copyCheck, typeCheck: doTypeCheck, sentCheck: doSentCheck,
  hint: () => {
    const w = M.queue[M.i].w, c = cleanEn(w.en.split(" / ")[0]);
    M.hintUsed = true;
    $("#hintLine").textContent = [...c].map((ch,i)=> i===0 ? ch : /[A-Za-z]/.test(ch) ? "_" : ch).join(" ");
  },
  skip: () => { const it = M.queue[M.i]; if (it.kind==="word") resolveWord(false,{}); else resolveSent(false,{fix:it.kind==="fix"}); },
  listen: () => startListening(),
  pzTap: b => { const pz = M.pz, k = +b.dataset.k; if (M.answered || pz.tiles[k].used) return; pz.tiles[k].used = true; pz.line.push(k); sfx("tap"); drawPuzzle(); },
  pzBack: b => { const pz = M.pz, k = +b.dataset.k; if (M.answered) return; const ti = pz.line.splice(k,1)[0]; pz.tiles[ti].used = false; drawPuzzle(); },
  pzCheck: () => {
    const pz = M.pz; if (!pz.line.length || M.answered) return;
    const built = pz.line.map(k=>pz.tiles[k].t).join(" ");
    resolveSent(built === pz.target.join(" "), {given: built + sentEnd(M.queue[M.i].s)});
  },
  fixTap: b => {
    if (M.answered) return;
    const it = M.queue[M.i], i = +b.dataset.i, wrong = wrongIdx(it.s), ok = wrong.has(i);
    document.querySelectorAll("#badLine .wtile").forEach((x,k)=>{ x.disabled = true; if (wrong.has(k)) x.classList.add("hit"); });
    if (!ok) b.classList.add("miss");
    if (ok) S.stats.fixRight++;
    setTimeout(()=>resolveSent(ok, {fix:true}), 500);
  },
  cont: () => { hideSheet(); M.i++; setTimeout(next, 120); },
  openExam: renderExamIntro, examGo: startExam,
  quit: () => { clearInterval(examTimer); if (REC) try{REC.abort();}catch(e){} if (HAS_TTS) speechSynthesis.cancel(); if (M && (M.right+M.wrong)>0){ markDay(); save(); } M = null; show("home"); },
  postTo: b => { PC.to = b.dataset.v; renderPost(); },
  postShuffle: () => openPost(),
  postSay: b => speak(PC.lines.join(" "), false, b),
  postSend: () => shareText("Möwen-Post", postText(), msg => { S.lastPost = today(); S.stats.posts++; save(); addKm(20); checkBadges({}); toast(msg); }),
  sendReport: () => shareText("Möwen-Bericht", reportText(true), msg => { S.lastBackup = today(); save(); renderBackup(); toast(msg); }),
  shareReport: () => shareText("Möwen-Bericht", reportText(true), msg => { S.lastBackup = today(); save(); toast(msg); }),
  pinGo,
  pinReset: () => { S.pin = null; save(); askPin(renderParents); },
  rewardSave: () => { S.reward = $("#rewardIn").value.trim(); save(); toast("Belohnung gespeichert"); },
  testSave: () => {
    const pl = $("#testPl").value, date = $("#testDate").value;
    if (!date || dayDiff(today(), date) < 0){ $("#testMsg").textContent = "Bitte ein Datum ab heute wählen."; return; }
    S.test = {pl, date, start: today()}; save(); renderParents(); toast("Test gespeichert");
  },
  testClear: () => { S.test = null; save(); renderParents(); },
  copyCode: b => {
    const t = $("#expCode");
    const done = () => { b.textContent = "Kopiert!"; setTimeout(()=>b.textContent="Code kopieren",1800); };
    try { navigator.clipboard.writeText(t.value).then(done, ()=>{ t.select(); b.textContent="Markiert, jetzt kopieren"; }); }
    catch(e){ t.select(); b.textContent="Markiert, jetzt kopieren"; }
  },
  importCode: () => {
    const msg = $("#impMsg");
    try {
      let raw = $("#impCode").value.trim();
      const m = raw.match(/([A-Za-z0-9+/=]{200,})\s*$/); if (m) raw = m[1];
      const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!data || typeof data.words!=="object") throw 0;
      const pin = S.pin; S = Object.assign(blank(), data, {pin}); save(); msg.textContent = `Geladen: ${Object.keys(S.words).length} Wörter, ${S.xp} XP.`;
    } catch(e){ msg.textContent = "Der Code ist ungültig. Bitte vollständig kopieren und erneut einfügen."; }
  },
  resetAsk: () => { $("#resetBox").innerHTML = `<p style="margin:0 0 8px">Wirklich alles löschen? Fortschritt, Möwe und Abzeichen gehen verloren.</p><div class="row"><button class="btn btn-ghost" data-act="openParents" style="flex:1">Abbrechen</button><button class="btn btn-bad" data-act="resetDo" style="flex:1">Ja, löschen</button></div>`; },
  resetDo: () => { try{ localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); localStorage.removeItem(FAM_KEY); }catch(e){} famCode = null; S = null; OB.color = 0; renderOnboard(true); show("onboard"); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && (e.target.id==="nameIn" || e.target.id==="gullIn")){ const b=$("[data-act=onboardGo]"); if (b) ACT.onboardGo(b); } });

/* ============ START ============ */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e) {}
if (SANDBOX) document.body.insertAdjacentHTML("beforeend", `<div class="beta-badge">BETA · eigener Teststand · <a href="friedrich.html">Prüfstand</a></div>`);
Object.assign(ACT, FAM_ACT, {doUpdate: b => { location.replace(location.pathname + "?v=" + b.dataset.v + location.hash); }});
setTimeout(checkUpdate, 1500);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkUpdate(); });
/* 3D-Kippeffekt: Postkarten und Karteikarten folgen dem Finger, mit Glanzlicht */
const TILT = ".pc:not(.locked), .postcard, .fc";
const tiltOff = el => { el.style.transform = ""; el.classList.remove("tilting"); };
document.addEventListener("pointermove", e => {
  if (RM) return; const el = e.target.closest && e.target.closest(TILT); if (!el) return;
  const r = el.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
  el.style.transform = `perspective(700px) rotateX(${(-y*12).toFixed(2)}deg) rotateY(${(x*14).toFixed(2)}deg) scale(1.02)`;
  el.style.setProperty("--gx", ((x+.5)*100).toFixed(0)+"%"); el.style.setProperty("--gy", ((y+.5)*100).toFixed(0)+"%");
  el.classList.add("tilting");
}, {passive:true});
["pointerup","pointercancel","pointerout"].forEach(t=>document.addEventListener(t, e => { const el = e.target.closest && e.target.closest(TILT); if (el && (t!=="pointerout" || !el.contains(e.relatedTarget))) tiltOff(el); }, {passive:true}));
if (BETA){ sceneBoot(); screensBoot(); }
if (!famBoot()){
  if (BETA) show("start");   /* Beta: Startseite nach Entwurf v4, "Los geht's" führt weiter */
  else if (S && S.name && S.gull) show("home");
  else if (S && S.name){ renderOnboard(false); show("onboard"); }
  else { renderOnboard(true); show("onboard"); }
}
})();

</script>
